[package]
name = "wk"
version = "0.1.0"
edition = "2024"
description = "Cross-harness CLI for driving local coding agents"
license = "GPL-3.0-only"

[[bin]]
name = "wk"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
crossbeam-channel = "0.5"
libc = "0.2"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
smol = "2"
waku-core = { path = "../waku-core" }
waku-protocol = { path = "../waku-protocol" }
